<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aspro Parks — Parques (concepto)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<style>
.country { cursor: pointer; min-height: 44px; padding: 8px 16px; border-radius: 12px; border: 1.5px solid var(--line); background: transparent; color: var(--ink); font: 500 15px var(--sans); }
.country[aria-pressed="true"] { border-color: var(--ink); text-decoration: underline; }
.park-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; margin: 36px 0 0; }
.park { border-radius: 24px; background: #fff; overflow: hidden; display: flex; flex-direction: column; }
.park-top { height: 170px; position: relative; display: flex; align-items: flex-end; padding: 16px; }
.park-photo { position: absolute; top: 16px; right: 16px; color: #fff; font-size: 12px; font-weight: 500; }
.park-body { padding: 20px 20px 22px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.park-name { margin: 0; font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: -.01em; }
.park-place { margin: 0; color: var(--muted); font-size: 15px; }
.park-open { cursor: pointer; align-self: flex-start; margin-top: 10px; min-height: 44px; padding: 0; border: 0; background: transparent; color: var(--ink); font: 700 16px var(--sans); }
.info { padding: 14px 16px; border-radius: 16px; background: #fff; }
.info-l { margin: 0; font-size: 13px; color: var(--muted); }
.info-v { margin: 4px 0 0; font-weight: 700; }
</style>
</head>
<body data-page="parques" data-accent="#1478B8">
<div id="site-header"></div>

<main class="sec-first sec-last">
  <div class="wrap">
    <p class="kicker">Nuestros parques</p>
    <div class="row-wrap between">
      <h1 class="display">Encuentra tu parque</h1>
      <p id="result-label" role="status" style="margin: 0; color: var(--muted); font-size: 17px"></p>
    </div>
    <div id="tabs" role="group" aria-label="Tipo de parque" style="display: flex; flex-wrap: wrap; gap: 8px; margin: 36px 0 0"></div>
    <div id="countries" role="group" aria-label="País" style="display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 0"></div>
    <div id="grid" class="park-grid"></div>
    <div id="empty" hidden style="margin: 36px 0 0; padding: 40px; border-radius: 24px; background: #fff; text-align: center">
      <p style="margin: 0; font-size: 18px">No hay parques de este tipo en ese país… todavía.</p>
      <button type="button" id="reset" class="chip" style="margin-top: 16px; background: var(--ink); color: var(--cream)">Ver todos</button>
    </div>
  </div>
</main>

<div id="modal" class="modal" hidden>
  <button type="button" class="modal-backdrop" data-close aria-label="Cerrar ficha"></button>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="m-name">
    <div id="m-top" style="height: 200px; position: relative; display: flex; align-items: flex-end; padding: 24px">
      <span id="m-type" class="pill"></span>
      <span style="position: absolute; top: 24px; left: 24px; color: #fff; font-size: 13px; font-weight: 500">[FOTO DEL PARQUE]</span>
      <button type="button" data-close aria-label="Cerrar" style="position: absolute; top: 16px; right: 16px; width: 44px; height: 44px; border-radius: 999px; border: 0; background: var(--cream); cursor: pointer; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#10233F" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>
    <div style="padding: 28px 28px 32px">
      <h2 id="m-name" style="margin: 0; font-family: var(--display); font-weight: 800; font-size: 34px; line-height: 1.05; letter-spacing: -.02em"></h2>
      <p id="m-place" style="margin: 8px 0 0; color: var(--muted); font-size: 16px"></p>
      <p id="m-desc" style="margin: 18px 0 0; font-size: 17px; line-height: 1.6; color: var(--body)"></p>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 22px 0 0">
        <div class="info"><p class="info-l">Temporada</p><p class="info-v">[Por confirmar]</p></div>
        <div class="info"><p class="info-l">Entrada desde</p><p class="info-v">[— €]</p></div>
        <div class="info"><p class="info-l">Ideal para</p><p id="m-ideal" class="info-v"></p></div>
        <div class="info"><p class="info-l">Horario hoy</p><p class="info-v">[—]</p></div>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 12px; margin: 26px 0 0">
        <a id="m-url" href="#" target="_blank" rel="noopener" class="btn btn-dark" style="padding: 14px 24px">Web oficial del parque</a>
        <a href="vivelo.html" style="padding: 14px 8px; font-weight: 700">Súbete en primera persona →</a>
      </div>
    </div>
  </div>
</div>

<div id="site-footer"></div>
<script src="assets/site.js"></script>
<script src="assets/parques.js"></script>
</body>
</html>
